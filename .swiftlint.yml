# Comprehensive SwiftLint configuration for ShadowDeck.
# Based on SwiftLint defaults + widely adopted opt-in rules (community / Apple-aligned style).
# Install: brew install swiftlint
# Run: Scripts/lint.sh

# Defaults stay on; enable recommended opt-in rules rather than a tiny only_rules set.
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  # trailing_closure — off: autocorrect breaks labeled multi-param SwiftUI inits
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

disabled_rules:
  # Solo app; many public APIs are intentional for tests / future modules.
  # Tracked in CODE_AUDIT; allow intentional TODOs without noise.
  - todo
  # Large SwiftUI feature files still exist; split over time without blocking CI.
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  # Existing codebase uses force unwraps sparingly in AppKit bridges; opt in later.
  - force_unwrapping
  - force_cast
  - force_try
  # SwiftUI style: labeled multi-closure APIs and @Environment inline are idiomatic.
  - multiple_closures_with_trailing_closure
  - attributes

included:
  - ShadowDeck
  - ShadowDeckTests

excluded:
  - build
  - DerivedData
  - Scripts
  - Docs/Screenshots

line_length:
  warning: 160
  error: 320
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true
  ignores_multiline_strings: true
  # Help copy / catalog prose often lives on one string line intentionally.
  excluded_lines_patterns:
    - '^\s*".*"'
    - '^\s*Text\(\s*".*"'
    - '^\s*\.help\(\s*".*"'
    - '^\s*Label\([^"]*".*"'
    - '^\s*message\s*='
    - '^\s*return\s+".*"'
    - '^\s*// swiftlint:disable'
    - 'map\s*='
    - 'softGlow\('
    - 'PriorityRecommendation'


identifier_name:
  min_length:
    warning: 2
  excluded:
    # Geometry / loop indices
    - id
    - x
    - y
    - i
    - j
    - k
    - n
    - w
    - h
    - dx
    - dy
    - vf
    # Domain priority letters (Shadowrun A–E)
    - a
    - b
    - c
    - d
    - e
    # Common short locals still used in tight math/regex
    - p
    - r
    - g
    - f
    - t
    - s
    - q
    - m
    - l
    - v
    - ok
    - to
    - as_
  allowed_symbols: ["_"]

type_name:
  min_length: 3
  max_length:
    warning: 55
    error: 70

function_parameter_count:
  warning: 12
  error: 16

large_tuple:
  warning: 5
  error: 8

vertical_whitespace:
  max_empty_lines: 2

trailing_whitespace:
  ignores_empty_lines: true

reporter: "xcode"
